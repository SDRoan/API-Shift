openapi: 3.0.3
info:
  title: Acme Payments API
  version: 1.0.0
servers:
  - url: https://api.acme.test

paths:
  /v1/charges:
    post:
      operationId: createCharge
      summary: Create a charge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency, source]
              properties:
                amount:
                  type: integer
                  description: Charge amount in the smallest currency unit
                currency:
                  type: string
                source:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: The created charge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'

    get:
      operationId: listCharges
      summary: List charges
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: starting_after
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A page of charges
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Charge'
                  has_more:
                    type: boolean

  /v1/charges/{chargeId}:
    get:
      operationId: getCharge
      summary: Fetch one charge
      parameters:
        - name: chargeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The charge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'

  /v1/refunds:
    post:
      operationId: createRefund
      summary: Refund a charge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [charge]
              properties:
                charge:
                  type: string
                amount:
                  type: integer
      responses:
        '200':
          description: The created refund
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string

components:
  schemas:
    Charge:
      type: object
      required: [id, amount, currency, status]
      properties:
        id:
          type: string
        amount:
          type: integer
        currency:
          type: string
        status:
          type: string
          enum: [pending, succeeded, failed]
        description:
          type: string
